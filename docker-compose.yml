services:

  trainer:
    build:
      context: .
      dockerfile: training/Dockerfile
    profiles: [train]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks: [app-net]

  backend:
    build: ./backend
    ports:
      - "5000:5000"            
    volumes:
      - ./models:/models:ro    
    networks: [app-net]
    restart: unless-stopped

networks:
  app-net:
